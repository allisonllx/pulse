[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldview-collector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "python-dotenv>=1,<2", "pyarrow>=17,<24"]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
embeddings = ["sentence-transformers>=3,<6"]
translations = ["transformers>=4.48,<6", "torch>=2.6,<3", "sentencepiece>=0.2,<1", "sacremoses>=0.1,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
worldview = "collector.cli:main"

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
